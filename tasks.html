<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sarah Salinas">
        <title>Stellr | Tasks </title>
        <link rel="stylesheet" href="styles.css">
        <!-- adobe font -->
        <link href="" rel="stylesheet">
        <!-- my javascript -->
        <!-- <script src="script.js" defer></script> -->
    </head>
    <body>
        <header>
            <!-- placeholder image, change size in css later -->
            <img src="images/froggie.png" alt="placeholder image of frog" width="40">
            <button id="reset">Reset</button>
            <nav>
                <!-- navigation with working links -->
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="tasks.html">Tasks</a></li>
                    <li><a href="progress.html">Progress</a></li>
                </ul>
            </nav>
           <h1> tasks</h1>
           <img src="images/froggie.png" alt="placeholder image of frog" width="100">
        </header>
        <main>
            <button id="newTask">NEW +</button>
            <dialog id="newTaskDialogBox">
                <form>
                    <button type="button" id="closeButton" aria-label="close task form">x</button>
                    <label for="taskName">Task name</label>
                    <input type="text" id="taskName" name="taskName" placeholder="Task name..." required>
                    <label for="taskDate">Date</label>
                    <input type="date" id="taskDate" name="taskDate" required>
                    <label for="recurring">Recurring</label>
                    <select name="recurring" id="recurring">
                        <option value="None">None</option>
                        <option value="Daily">Daily</option>
                        <option value="Weekly">Weekly</option>
                        <option value="Monthly">Monthly</option>
                      </select>
                    <input type="submit" value="Create Task">
                    <input type="button" id="cancelButton" value="Cancel">
                </form>
            </dialog>
            <section id="tasksContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Due</th>
                            <th>Progress</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </section>
        </main>
        <footer>
            <p>&copy; Stellr made by Sarah Salinas</p>

        </footer>
    </body>
</html>
