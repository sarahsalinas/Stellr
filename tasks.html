<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sarah Salinas">
        <title>Stellr | Tasks </title>
        <link rel="stylesheet" href="styles.css">
        <!-- adobe font -->
        <link href="" rel="stylesheet">
        <!-- my javascript -->
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <!-- placeholder image, change size in css later -->
            <img src="images/froggie.png" alt="placeholder image of frog" width="40">
            <button id="reset">Reset</button>
            <nav>
                <!-- navigation with working links -->
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="tasks.html">Tasks</a></li>
                    <li><a href="progress.html">Progress</a></li>
                </ul>
            </nav>
           <h1> tasks</h1>
           <img src="images/froggie.png" alt="placeholder image of frog" width="100">
        </header>
        <main>
            <!-- NEW TASK -->
            <button id="newTask">NEW +</button>
            <dialog id="newTaskDialogBox">
                <form id="newTaskForm">
                    <button type="button" id="closeButton" aria-label="close task form">x</button>
                    <label for="taskName">Task name</label>
                    <input type="text" id="taskName" name="taskName" placeholder="Task name..." required>
                    <label for="taskDate">Date</label>
                    <input type="date" id="taskDate" name="taskDate" required>
                    <label for="recurring">Recurring</label>
                    <select name="recurring" id="recurring">
                        <option value="None">None</option>
                        <option value="Daily">Daily</option>
                        <option value="Weekly">Weekly</option>
                        <option value="Monthly">Monthly</option>
                      </select>
                    <input type="submit" id="submitTaskButton" value="Create Task">
                    <input type="button" id="cancelButton" value="Cancel">
                    <button type="button" id="deleteTaskButton" hidden>Delete Task</button>
                </form>
            </dialog>
            <!-- delete confirmation dialog box -->
            <dialog id="deleteConfirmDialog">
                <h1>Delete Task?</h1>
                <p>This cannot be undone!</p>
                <button type="button" id="deleteTaskButtonConfirm">Delete Task</button>
                <button type="button" id="cancelDeleteTaskButton">Cancel</button>
            </dialog>
            <!-- FOCUS TIMER DIALOG BOX -->
            <dialog id="focusDialogBox">
                <form id="focusForm">
                    <button type="button" id="closeFocusButtonDialog" aria-label="close focus form">x</button>
                    <h2>Focus Mode</h2>
                    <p id="focusModeTaskName"></p>
                    <label for="focusLength">Focus for:</label>
                    <select name="focusLength" id="focusLength">
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="60">1 hour</option>
                        <option value="120">2 hours</option>
                        <option value="240">4 hours</option>
                      </select>
                    <input type="submit" value="Start!">
                    <input type="button" id="focusCancelButton" value="Cancel">
                </form>
            </dialog>
            <!-- FOCUS TIMER SESSION BEGINS, INITIALLY HIDDEN -->
            <section id="focusTimer" hidden>
                <button type="button" id="closeFocusButton" aria-label="end focus timer session">x</button>
                <img src="images/froggie.png" alt="placeholder image of frog" width="440" height="220">
                <p>Time left for:</p>
                <p id="focusTimerTaskName"></p>
                <p id="timerCountDown">15:00</p>
                <button type="button" id="pause" aria-label="pause focus timer">Pause</button>
                <button type="button" id="end" aria-label="end focus timer">End</button>
                <button type="button" id="addTime" aria-label="add more time to focus timer">Add Time</button>
                <dialog id="addTimeBox">
                    <form id="addTimeForm">
                        <!-- ADD MORE TIME OPTION -->
                        <label for="addTimeAmount">Amount: </label>
                        <select name="addTimeAmount" id="addTimeAmount">
                            <option value="15">15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="60">1 hour</option>
                            <option value="120">2 hours</option>
                            <option value="240">4 hours</option>
                        </select>
                        <input type="submit" value="Add Time">
                        <input type="button" id="addTimeCancelButton" value="Cancel">
                    </form>
                </dialog>
            </section>
            <!-- FINISHED FOCUS MODE DIALOG -->
            <dialog id="completeTaskDialog">
                <button type="button" id="closeFinishedFocusButton" aria-label="close finished focused session">x</button>
                <h3>Good Job!</h3>
                <p>Elapsed time: </p>
                <p id="elapsedTime"></p>
                <p>Total time spent on</p>
                <p id="completeFocusTask"></p>
                <p id="totalTimeSpent"></p>
                <input type="button" id="closeFinishedFocusButton2" value="Close">
            </dialog>
            <!-- TASKS CREATED -->
            <section id="tasksContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Due</th>
                            <th>Progress</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </section>
        </main>
        <footer>
            <p>&copy; Stellr made by Sarah Salinas</p>

        </footer>
    </body>
</html>
