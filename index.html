<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sarah Salinas">
        <title>Stellr | Task and Focus Timer</title>
        <link rel="stylesheet" href="styles.css">
        <link href="" rel="stylesheet">
        <script src="shared.js" defer></script>
        <script src="dashboard.js" defer></script>
    </head>
    <body>
        <header>
            <dialog id="namePromptDialog">
                <form id="namePrompt">
                    <h2>What's your name?</h2>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Sarah" required>
                    <input type="submit" value="Enter">
                </form>
            </dialog>
            <div id="reset-container">
                <p>D</p>
                <button id="reset">Reset</button>
            </div>
            <div id="greeting-container">
                <h1 id="pageGreeting">Welcome to Stellr, </h1>
                <p id="randomEmoji"></p>
            </div>
           <div id="nav-container">
                <nav>
                <!-- navigation with working links -->
                    <ul>
                        <li><a href="index.html" class="active">Dashboard</a></li>
                        <li><a href="tasks.html">Tasks</a></li>
                        <li><a href="progress.html">Progress</a></li>
                    </ul>
               </nav>
           </div>
        </header>
        <main>
            <section id="dashboardContainer">
                <div id="noTasks">
                    <p>No upcoming tasks...</p>
                    <a href="tasks.html" id="createOne">create one?</a>
                </div>
                <div id="upcomingTasks">
                    <p id="comingUp">Here's what's coming up:</p>

                </div>
            </section>
        </main>
        <footer>
            <p>&copy; Stellr made by Sarah Salinas</p>

        </footer>
    </body>
</html>
