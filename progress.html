<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Sarah Salinas">
        <title>Stellr | Progress </title>
        <link rel="stylesheet" href="styles.css">
        <!-- adobe font -->
        <link href="" rel="stylesheet">
        <script src="shared.js" defer></script>
        <script src="progress.js" defer></script>
    </head>
    <body>
        <header>
            <img src="images/froggie.png" alt="placeholder image of frog" width="40">
            <button id="reset">Reset</button>
            <nav>
                <!-- navigation with working links -->
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="tasks.html">Tasks</a></li>
                    <li><a href="progress.html">Progress</a></li>
                </ul>
            </nav>
            <h1> progress</h1>
            <img src="images/froggie.png" alt="placeholder image of frog" width="100">
        </header>
        <main>
            <section id="tasksCompleted">
                <p><span id="numberCompleted">0</span> tasks completed this month!</p>
            </section>
            <table id="inProgressTable">
                <thead>
                    <tr>
                        <th>In Progress</th>
                        <th>Time Spent</th>
                        <th><button type="button" id="progressTableButton" aria-label="in progress tasks toggle" aria-expanded="true">v</button></th>
                    </tr>
                </thead>
                <tbody id="inProgressBody">

                </tbody>
            </table>
            <table id="completedTable">
                <thead>
                    <tr>
                        <th>Completed</th>
                        <th>Time Spent</th>
                        <th>Date Completed</th>
                        <th><button type="button" id="completedTableButton" aria-label="completed tasks toggle" aria-expanded="true">v</button></th>
                    </tr>
                </thead>
                <tbody id="completedBody">

                </tbody>
            </table>
        </main>
        <footer>
            <p>&copy; Stellr made by Sarah Salinas</p>

        </footer>
    </body>
</html>
